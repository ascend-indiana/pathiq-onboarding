<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PathIQ | Ascend Indiana</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2345AADD' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M3 19a2 2 0 1 0 4 0a2 2 0 1 0 -4 0'/%3E%3Cpath d='M17 5a2 2 0 1 0 4 0a2 2 0 1 0 -4 0'/%3E%3Cpath d='M11 19h5.5a3.5 3.5 0 0 0 0 -7h-8a3.5 3.5 0 0 1 0 -7h4.5'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--char:#1C1C1C;--blue:#45AADD;--blue-d:#2B8FC4;--teal:#7CFCEA;--bg:#F8FAFB;--soft:#F1F5F8;--line:#E3E8EC;--mute:#5E6A72}
*{box-sizing:border-box;margin:0}
body{font-family:Archivo,Tahoma,Arial,sans-serif;color:var(--char);background:#fff;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
a{color:var(--blue-d);font-weight:600;text-decoration:none}a:hover{text-decoration:underline}
.page{min-height:100vh;display:grid;grid-template-columns:44% 56%}
.brand{background:var(--char);color:#fff;padding:44px 48px;display:grid;grid-template-rows:auto 1fr auto;justify-items:center;position:relative;overflow:hidden}
.brand:before{content:"";position:absolute;right:-140px;top:-140px;width:420px;height:420px;border-radius:50%;border:2px solid rgba(69,170,221,.35)}
.brand:after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;border:2px solid rgba(69,170,221,.25)}
.brand .blob{position:absolute;left:-120px;bottom:-120px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(69,170,221,.4),transparent 70%)}
.logo{display:inline-flex;flex-direction:column;align-items:center;line-height:1}
.logo .row{display:flex;align-items:center;gap:8px;font-weight:700;font-size:28px;letter-spacing:-.5px}
.logo .path{margin-right:-8px}.logo .iq{color:var(--blue)}
.logo small{font-size:8px;letter-spacing:2px;opacity:.7;margin-top:4px;font-weight:600}
.logo svg{width:30px;height:30px;stroke:var(--blue);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.brand .logo{align-self:flex-start}
.hero{position:relative;z-index:1;max-width:420px;align-self:center}
.hero h2{font-size:clamp(28px,3.4vw,42px);line-height:1.1;letter-spacing:-1px;font-weight:700;margin-bottom:18px}
.hero h2 span{color:var(--blue)}
.stat{margin-bottom:26px}
.stat b{display:block;font-size:60px;line-height:1;letter-spacing:-2px;color:var(--blue);font-weight:700}
.stat span{display:block;margin-top:8px;font-size:13px;letter-spacing:1.4px;text-transform:uppercase;color:#C3CDD3}
.hero ul{list-style:none;padding:0;display:grid;gap:12px;font-size:16px;color:#D6DEE3}
.hero li{display:flex;gap:10px;align-items:flex-start}
.hero li:before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--blue);margin-top:8px}
.partnerrow{position:relative;z-index:1;display:flex;align-items:center;gap:12px;font-size:12px;color:#AEB9C0}
.plogo{width:96px;height:40px;border:1.5px dashed #6C7A83;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:1px;color:#8E9BA3}
.side{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;position:relative}
.card{width:100%;max-width:440px}
.mlogo{display:none}
.dots{display:flex;align-items:center;margin-bottom:28px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #A9B5BD;background:#fff;flex:none}
.dots i.on{background:var(--char);border-color:var(--char)}
.dots u{flex:1;height:2px;background:#A9B5BD}.dots u.on{background:var(--char)}
h1{font-size:30px;letter-spacing:-.8px;margin-bottom:8px;font-weight:700}
.sub{color:var(--mute);margin-bottom:22px;line-height:1.5}
.sso{display:grid;gap:10px}
.sbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:13px 18px;font-weight:600;font-size:15.5px;transition:.15s}
.sbtn:hover{border-color:var(--char)}.sbtn svg{width:20px;height:20px}
.or{display:flex;align-items:center;gap:12px;color:var(--mute);font-size:13px;margin:20px 0}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
label{display:block;font-size:13px;font-weight:600;margin:0 0 6px}
.field{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:13px 16px;font-size:16px;background:#fff;outline:0}
.field:focus{border-color:var(--blue)}.field.err{border-color:#D6454D}
.fg{margin-bottom:14px;position:relative}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.eye{position:absolute;right:12px;top:33px;background:none;border:0;color:var(--mute);font-size:13px;font-weight:600}
.hint{font-size:12.5px;color:var(--mute);margin-top:6px}.hint.err{color:#D6454D}
.btn{background:var(--char);color:#fff;border:0;border-radius:999px;padding:14px 26px;font-weight:600;width:100%;font-size:16px}
.btn:hover{background:#000}.btn.auto{width:auto;padding:13px 34px}
.outline{background:#fff;color:var(--char);border:1.5px solid var(--char);border-radius:999px;padding:12px 24px;font-weight:600}
.linkbtn{background:none;border:0;color:var(--blue-d);font-weight:600;font-size:14px;padding:6px}
.fine{font-size:12px;color:var(--mute);text-align:center;margin-top:14px;line-height:1.5}
.login{text-align:center;margin-top:20px;font-size:14.5px;color:var(--mute)}
.foot{text-align:center;font-size:12px;color:var(--mute);margin-top:26px;line-height:1.6}
.notice{background:#FFF6E0;border:1px solid #F3D78B;border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:14px;line-height:1.45}
.nav2{display:flex;justify-content:space-between;align-items:center;margin-top:26px}
.skip{display:flex;gap:10px;align-items:center}
.skipall{text-align:center;margin-top:18px}
.skipall button{color:var(--mute);font-weight:400;text-decoration:underline}
.tiles{display:grid;gap:10px}
.tile{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;display:flex;gap:12px;align-items:flex-start;transition:.15s;width:100%}
.tile:hover{border-color:var(--blue)}
.tile.on{border-color:var(--char);box-shadow:inset 0 0 0 1px var(--char)}
.tile i{font-style:normal;font-size:22px;line-height:1.2}
.tile b{display:block;font-size:15.5px}.tile span{display:block;font-size:13px;color:var(--mute);margin-top:3px;line-height:1.35}
.tile .ck{margin-left:auto;width:22px;height:22px;border:2px solid #A9B5BD;border-radius:6px;flex:none;color:#fff;text-align:center;line-height:18px;font-size:14px}
.tile.on .ck{background:var(--char);border-color:var(--char)}
.addrow{display:flex;gap:8px}
.acwrap{position:relative;flex:1}
.addbtn{background:var(--blue);color:#fff;border:0;border-radius:14px;padding:0 20px;font-weight:600}
.addbtn:hover{background:var(--blue-d)}
.sug{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 30px rgba(28,28,28,.14);z-index:5;overflow:hidden;display:none}
.sug button{display:flex;justify-content:space-between;width:100%;text-align:left;background:none;border:0;padding:12px 16px;font-size:15.5px}
.sug button:hover,.sug button.hl{background:var(--soft)}
.sug small{color:var(--mute);font-size:13px}
.sug .lbl{padding:8px 16px 2px;font-size:11.5px;letter-spacing:1px;color:var(--mute);font-weight:600}
.count{font-size:13px;color:var(--mute);margin-top:16px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;min-height:34px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#E3F3FB;color:#1D6F9A;border-radius:999px;padding:7px 8px 7px 14px;font-weight:600;font-size:14.5px}
.chip b{background:#fff;border-radius:50%;width:20px;height:20px;line-height:19px;text-align:center;font-size:14px;cursor:pointer}
.empty{color:var(--mute);font-size:14px;padding-top:6px}
textarea.field{resize:none;min-height:150px;line-height:1.45}
.counter{text-align:right;font-size:13px;color:var(--mute);margin-top:6px}.counter.warn{color:#C77700;font-weight:600}
.priv{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--mute);margin-top:12px;line-height:1.45}
.slide{animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* partner brand */
.pimg{display:block;max-width:100%;height:auto}
.plead{position:relative;z-index:1;width:100%;text-align:center}
.plead .pimg{width:min(540px,100%);margin:0 auto}
.cc{margin-top:14px;font-size:15px;letter-spacing:5px;font-weight:600;color:#C3CDD3;padding-left:5px}
.pfoot{position:relative;z-index:1}
.pfoot .pw{align-items:center;margin:0}
.pfoot .pw>span:first-child{font-size:11px}
.pfoot .piq{font-size:21px}.pfoot .piq svg{width:22px;height:22px}
.ctr h1,.ctr .sub{text-align:center}
.pw{display:flex;flex-direction:column;align-items:flex-start;gap:5px;margin-top:10px}
.pw>span:first-child{font-size:9px;letter-spacing:2px;font-weight:600;color:#9AA7AF}
.piq{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:16px;letter-spacing:-.3px;color:#fff}
.piq b{font-weight:700}.piq .q{color:var(--blue);margin-left:-5px}
.piq svg{width:17px;height:17px;stroke:var(--blue);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
/* chat landing */
#chat{display:none;min-height:100vh;background:var(--bg);flex-direction:column}
#chat header{display:flex;justify-content:space-between;align-items:center;padding:0 24px;height:68px;background:var(--char);color:#fff}
#chat .hl{display:flex;align-items:center;gap:16px}#chat .hl .pimg{height:28px;width:auto;margin:0}#chat .hlogo{display:flex;flex-direction:column;align-items:center}
.cc.sm{font-size:11px;letter-spacing:3.5px;margin-top:8px;padding-left:3.5px}.cc.xs{font-size:8px;letter-spacing:2.5px;margin-top:3px;padding-left:2.5px}#chat .hl .pw{flex-direction:row;gap:8px;margin:0;align-items:center}
#chat .avatar{background:var(--blue)}
#chat .logo{align-items:flex-start}#chat .logo .row{font-size:20px}#chat .logo svg{width:22px;height:22px}#chat .logo small{display:none}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--char);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px}
.cwrap{flex:1;display:flex;flex-direction:column;max-width:720px;width:100%;margin:0 auto;padding:24px 20px 20px}
#msgs{flex:1;overflow:auto;padding-bottom:12px}
.m{max-width:85%;padding:11px 15px;border-radius:16px;margin:8px 0;font-size:15.5px;line-height:1.5}
.m.u{background:var(--blue);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.m.a{background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.replies{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.rep{background:#fff;border:1.5px solid var(--blue);color:var(--blue-d);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14.5px}
.rep:hover{background:#E3F3FB}
.cbar{display:flex;gap:8px;align-items:flex-end;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:8px}
.cbar:focus-within{border-color:var(--blue)}
.cbar textarea{flex:1;border:0;outline:0;resize:none;font-size:15.5px;line-height:1.4;padding:8px 10px;max-height:140px;background:transparent}
.cbar .btn{width:auto;padding:10px 20px}
/* review nav */
.jump{position:fixed;left:8px;bottom:8px;background:var(--char);color:#fff;border-radius:999px;padding:4px 6px;display:flex;gap:2px;z-index:40;font-size:11px;opacity:.9}
.jump button{background:none;border:0;color:#cfd8de;padding:4px 9px;border-radius:999px;font-size:11px}
.jump button:hover{background:#333;color:#fff}
.mstat{display:none}
@media(max-width:860px){
 .page{grid-template-columns:1fr}.brand{display:none}
  .mlogo{display:flex;flex-direction:column;align-items:center;background:var(--char);width:100vw;margin:-28px 0 20px calc(50% - 50vw);padding:30px 24px 22px}
 .mlogo .pimg{width:240px}
 .mlogo .pw{align-items:center}
 .mstat{display:block;text-align:center;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mute);margin-bottom:24px}
 .mstat b{display:block;font-size:38px;line-height:1.05;letter-spacing:-1.2px;color:var(--blue-d);font-weight:700;text-transform:none}
 .side{justify-content:flex-start;padding-top:28px}
 h1{font-size:26px}.two{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="jump" id="jump"><button data-j="account">Sign up</button><button data-j="signin">Sign in</button><button data-j="forgot">Forgot</button><button data-j="s0">Industries</button><button data-j="s1">Location</button><button data-j="s2">Titles</button><button data-j="s3">About you</button><button data-j="chat">Chat</button></div>

<div class="page" id="pg">
  <aside class="brand">
    <div class="plead"><img class="pimg" alt="EmployIndy"><div class="cc">CAREER CONNECT</div></div>
    <div class="hero">
      <div class="stat"><b>50,619</b><span>current Indiana job listings</span></div>
      <h2>Find work that fits <span>your life</span> in Indiana.</h2>
      <ul><li>Jobs in Indiana's advanced industries, updated daily</li><li>Ask for what you want in plain language</li><li>Free for every Hoosier</li></ul>
    </div>
    <div class="pfoot"><div class="pw"><span>POWERED BY ASCEND</span><span class="piq"><svg viewBox="0 0 24 24"><path d="M3 19a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M17 5a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M11 19h5.5a3.5 3.5 0 0 0 0 -7h-8a3.5 3.5 0 0 1 0 -7h4.5"/></svg><b>Path</b><b class="q">IQ</b></span></div></div>
    <div class="blob"></div>
  </aside>
  <main class="side"><div class="card" id="card"></div></main>
</div>

<section id="chat">
  <header><div class="hl"><div class="hlogo"><img class="pimg" alt="EmployIndy"><div class="cc xs">CAREER CONNECT</div></div><span class="pw"><span>POWERED BY ASCEND</span><span class="piq"><svg viewBox="0 0 24 24"><path d="M3 19a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M17 5a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M11 19h5.5a3.5 3.5 0 0 0 0 -7h-8a3.5 3.5 0 0 1 0 -7h4.5"/></svg><b>Path</b><b class="q">IQ</b></span></span></div><div class="avatar" id="av">SE</div></header>
  <div class="cwrap"><div id="msgs"></div><div class="replies" id="reps"></div>
   <form class="cbar" id="cform"><textarea id="cin" rows="1" placeholder="Tell me what kind of work you're looking for…"></textarea><button class="btn">Send</button></form></div>
</section>

    <div class="tiles">${IND.map(([e,n,b])=>`<button class="tile ${S.inds.has(n)?'on':''}" data-ind="${n}"><i>${e}</i><div><b>${n}</b><span>${b}</span></div><div class="ck">${S.inds.has(n)?'✓':''}</div></button>`).join('')}</div>${nav()}</div>`;return}
  if(S.step===1)return stepTA('loc','Where would you like to work?','Start typing a city or ZIP code. Add up to 3 places.',nav());
  if(S.step===2)return stepTA('title','What kind of jobs are you interested in?','Add up to 5 job titles. They don’t have to be exact, just do your best.',nav());
  if(S.step===3){
    c.innerHTML=`<div class="slide">${mlogo}${dots()}<h1>Tell us about you</h1><p class="sub">Briefly: who you are, what matters to you, what kind of work you want.</p>
    <textarea class="field" id="about" maxlength="500" placeholder="Optional">${S.about}</textarea><div class="counter" id="ctr">${S.about.length}/500</div>
    <div class="priv"><span>🔒</span><span>Just you and your PathIQ assistant see this. You can change it any time.</span></div>${nav(true)}</div>`}
}
function stepTA(kind,h,sub,nav){
  CUR=kind;const cf=CFG[kind];
  $('#card').innerHTML=`<div class="slide">${mlogo}${dots()}<h1>${h}</h1><p class="sub">${sub}</p>
  <form class="addrow" id="addF" autocomplete="off"><div class="acwrap"><input class="field" id="ta" placeholder="${cf.ph}"><div class="sug" id="sug"></div></div><button class="addbtn">Add</button></form>
  <div class="hint err" id="taH" style="display:none"></div><div class="count" id="cnt"></div><div class="chips" id="chips"></div>${nav}</div>`;
  chips();
}
function chips(){const cf=CFG[CUR],arr=S[cf.list];
  $('#cnt').textContent=`${cf.cnt} (${arr.length} of ${cf.max})`;
  $('#chips').innerHTML=arr.length?arr.map((l,i)=>`<span class="chip">${l}<b data-rm="${i}" title="Remove">×</b></span>`).join(''):'<div class="empty">Nothing added yet.</div>'}
function showSug(){const cf=CFG[CUR],q=$('#ta').value;OPTS=cf.opts(q);HL=-1;const el=$('#sug');
  el.style.display=OPTS.length?'block':'none';
  el.innerHTML=(!q.trim()&&OPTS.length?'<div class="lbl">SUGGESTED FOR YOU</div>':'')+OPTS.map((o,i)=>`<button type="button" data-i="${i}">${o.label}${o.hint?`<small>${o.hint}</small>`:''}</button>`).join('')}
function err(m){const h=$('#taH');h.textContent=m;h.style.display='block'}
function addItem(label){const cf=CFG[CUR],arr=S[cf.list];$('#taH').style.display='none';
  if(arr.includes(label))return err('Already added.');
  if(arr.length>=cf.max)return err(`You can add up to ${cf.max}.`);
  arr.push(label);$('#ta').value='';$('#sug').style.display='none';chips();$('#ta').focus()}
function submitTA(){const cf=CFG[CUR],q=$('#ta').value.trim();if(!q)return;const o=cf.opts(q);
  if(HL>=0&&OPTS[HL])return addItem(OPTS[HL].label);
  if(o.length&&(CUR==='loc'||o.length===1&&o[0].label.toLowerCase()===q.toLowerCase()))return addItem(o[0].label);
  const f=cf.free(q);if(f.err)return err(f.err);addItem(f.label)}
/* chat landing */
function renderChat(){
  $('#av').textContent=(S.first[0]||'S')+(S.last[0]||'');
  const inds=[...S.inds].filter(x=>x!=='Something else');
  const bits=[];
  if(inds.length)bits.push('interested in '+inds.map(x=>x.replace(' & ',' and ')).join(' and ').toLowerCase());
  const loc=S.locs.length?' near '+S.locs.map(l=>l.replace(', IN','')).join(' or '):'';
  const tt=S.titles.length?'looking for roles like '+S.titles.slice(0,2).join(' or '):'';
  let line;
  if(bits.length||tt||loc){line=`Thanks, ${S.first}! I see you're ${[bits[0],tt].filter(Boolean).join(' and ')||'ready to start looking'}${loc}. Want me to pull up some roles?`}
  else line=`Thanks, ${S.first}! Tell me what kind of work you're looking for, or tap one of these to get started.`;
  $('#msgs').innerHTML='';say('a',line);
  $('#reps').innerHTML=['Show me jobs','Tell me about local training','Help me figure out what I want'].map(r=>`<button class="rep">${r}</button>`).join('');
}
function say(w,t){const m=document.createElement('div');m.className='m '+w;m.textContent=t;$('#msgs').appendChild(m);$('#msgs').scrollTop=1e5}
function userSays(t){$('#reps').innerHTML='';say('u',t);setTimeout(()=>say('a','In the full product, this is where PathIQ would reply and show jobs. (Next user story.)'),350)}
/* events */
document.addEventListener('click',e=>{
  const t=e.target;
  const j=t.closest('[data-j]');if(j){const v=j.dataset.j;if(v[0]==='s'&&v.length===2)setView('flow',+v[1]);else setView(v);return}
  const go=t.closest('[data-go]');
  if(go){e.preventDefault();const g=go.dataset.go;if(g==='sso')setView('flow',0);else setView(g);return}
  if(t.id==='eye'){const p=$('#pw');p.type=p.type==='password'?'text':'password';t.textContent=p.type==='password'?'Show':'Hide';return}
  const ti=t.closest('[data-ind]');if(ti){const n=ti.dataset.ind;S.inds.has(n)?S.inds.delete(n):S.inds.add(n);render();return}
  const sg=t.closest('.sug button');if(sg){addItem(OPTS[+sg.dataset.i].label);return}
  if(t.dataset.rm!==undefined){S[CFG[CUR].list].splice(+t.dataset.rm,1);chips();return}
  if(t.id==='nextB'||t.id==='skipB'){if(S.step===STEPS-1)setView('chat');else{S.step++;render()}return}
  if(t.id==='skipAll'){setView('chat');return}
  if(t.id==='backB'){S.step--;render();return}
  if(t.classList.contains('rep')){userSays(t.textContent);return}
  if(!t.closest('.acwrap')){const s=$('#sug');if(s)s.style.display='none'}
});
document.addEventListener('focusin',e=>{if(e.target.id==='ta')showSug()});
document.addEventListener('input',e=>{
  if(e.target.id==='ta'){$('#taH').style.display='none';showSug()}
  if(e.target.id==='about'){S.about=e.target.value;const n=S.about.length,c=$('#ctr');c.textContent=n+'/500';c.classList.toggle('warn',n>=450)}
  if(e.target.id==='cin'){const a=e.target;a.style.height='auto';a.style.height=Math.min(a.scrollHeight,140)+'px'}
});
document.addEventListener('keydown',e=>{
  if(e.target.id==='ta'){
   if(e.key==='ArrowDown'&&OPTS.length){e.preventDefault();HL=(HL+1)%OPTS.length;document.querySelectorAll('.sug button').forEach((b,i)=>b.classList.toggle('hl',i===HL))}
   if(e.key==='ArrowUp'&&OPTS.length){e.preventDefault();HL=(HL-1+OPTS.length)%OPTS.length;document.querySelectorAll('.sug button').forEach((b,i)=>b.classList.toggle('hl',i===HL))}
   if(e.key==='Escape')$('#sug').style.display='none'}
  if(e.target.id==='cin'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#cform').requestSubmit?$('#cform').requestSubmit():$('#cform').dispatchEvent(new Event('submit',{cancelable:true}))}
});
const emOk=v=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v);
document.addEventListener('submit',e=>{
  e.preventDefault();const id=e.target.id;
  if(id==='addF')submitTA();
  if(id==='cform'){const v=$('#cin').value.trim();if(v){$('#cin').value='';$('#cin').style.height='auto';userSays(v)}}
  if(id==='acct'){
    const fn=$('#fn').value.trim(),ln=$('#ln').value.trim(),em=$('#em').value.trim(),pw=$('#pw').value;let ok=true;
    for(const [el,good] of [[$('#fn'),!!fn],[$('#ln'),!!ln],[$('#em'),emOk(em)],[$('#pw'),pw.length>=8]]){el.classList.toggle('err',!good);ok=ok&&good}
    $('#emH').style.display=emOk(em)?'none':'block';$('#pwH').className='hint'+(pw.length>=8?'':' err');
    if(ok&&em.toLowerCase()==='existing@example.com'){$('#exist').style.display='block';return}
    if(ok){S.first=fn;S.last=ln;setView('flow',0)}
  }
  if(id==='sin'){const em=$('#em').value.trim(),pw=$('#pw').value;
    if(!emOk(em)||!pw){$('#bad').style.display='block';return}
    if(pw==='wrong'){$('#bad').style.display='block';return}
    setView('chat')}
  if(id==='fgt'){if(emOk($('#em').value.trim()))$('#sent').style.display='block'}
});
render();
document.querySelectorAll('img.pimg:not([src])').forEach(i=>i.src=P);
</script>
</body>
</html>
